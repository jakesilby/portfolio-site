<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jake Silby — Portfolio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Spline+Sans+Mono:wght@400;500&family=Barlow:wght@700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="tokens.css">
  <link rel="stylesheet" href="components/components.css">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      background: var(--bg-page);
      color: var(--text-primary);
      font-family: var(--font-family-sans);
    }
    .hero-panel {
      display: flex;
      flex-direction: column;
      gap: var(--gap-hero-text);
      background: var(--bg-hero);
      padding: var(--padding-hero-y) var(--padding-section-x);
    }
    .hero-panel__heading {
      color: var(--text-hero-heading);
    }
    .hero-panel__subhead {
      color: var(--text-hero-subhead);
    }

    @media (prefers-reduced-motion: no-preference) {
      .hero-panel {
        animation: hero-panel-wipe 850ms cubic-bezier(0.16, 1, 0.3, 1) both;
      }
      .hero-panel__heading {
        animation: hero-text-in 420ms ease-out both;
        animation-delay: 300ms;
      }
      .hero-panel__subhead {
        animation: hero-text-in 380ms ease-out both;
        animation-delay: 450ms;
      }
    }

    @keyframes hero-panel-wipe {
      from { clip-path: inset(0 100% 0 0); }
      to { clip-path: inset(0 0 0 0); }
    }

    @keyframes hero-text-in {
      from {
        opacity: 0;
        transform: translateY(8px) scale(0.98);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    .section-label {
      color: var(--text-primary);
      padding: var(--padding-section-x);
      border-bottom: 1px dashed var(--border-divider);
    }
  </style>
</head>
<body data-page="work">
  <script src="components/nav.js"></script>

  <section class="hero-panel">
    <p class="hero-panel__heading type-hero-heading">Hi, I’m Jake</p>
    <p class="hero-panel__subhead type-hero-subhead">I am a product designer based in Brooklyn, NY.</p>
  </section>

  <p class="section-label type-section-label">Selected Work ↓</p>

  <script src="components/project-row.js"></script>

  <script src="components/footer.js"></script>
</body>
</html>
