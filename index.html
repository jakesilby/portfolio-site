<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jake Silby — Portfolio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;1,400&family=Spline+Sans+Mono:wght@400;500&family=Barlow:wght@700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="tokens.css">
  <link rel="stylesheet" href="components/components.css">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      background: var(--bg-page);
      color: var(--text-primary);
      font-family: var(--font-family-sans);
    }
    .hero-section {
      padding: var(--hero-section-padding-y) var(--padding-section-x);
    }
    .hero-card {
      position: relative;
      width: 634px; /* was 490px — corrected against Figma node 507:24
       * ("Site Hero"), which fixes this at 634px. Previous value was
       * hand-tuned to fit rendered copy rather than matched to the frame. */
      max-width: 100%;
      height: 264px; /* was 268px — corrected against node 507:24. */
    }
    @property --gradient-angle {
      syntax: '<angle>';
      initial-value: 109.04deg;
      inherits: false;
    }

    .hero-card__glow {
      position: absolute;
      top: 0;
      left: var(--hero-card-glow-offset-left);
      width: 631px; /* was 483px — corrected against Figma node 507:24. */
      height: 263px; /* was 268px — corrected against node 507:24. */
      border-radius: var(--radius-lg);
      background: linear-gradient(
        var(--gradient-angle),
        var(--bg-accent) 0%,
        var(--color-greenwhite-6) 49%,
        var(--bg-hero) 100%
      ); /* was per-stop color-mix() transparency at 60/30/60% and
       * 0/48.83/99.516% — node 507:24 specifies solid stops at these three
       * colors and percentages, with opacity 0.7 applied once to the whole
       * layer (already set below), not baked into each stop. */
      filter: blur(13.45px); /* verified against Figma node 507:24 on
       * 2026-09-14 — 13.45px was correct all along; an earlier pass without
       * live Figma access had changed this to 26.9px, which live
       * verification shows was wrong. */
      opacity: 0.7;
    }

    @media (prefers-reduced-motion: no-preference) {
      .hero-card__glow {
        animation: hero-glow-rotate 48s linear infinite;
      }
    }

    @keyframes hero-glow-rotate {
      from { --gradient-angle: 109.04deg; }
      to { --gradient-angle: 469.04deg; }
    }
    .hero-card__content {
      position: absolute;
      top: var(--hero-card-offset-top);
      left: var(--hero-card-offset-left);
      width: 600px; /* NEW — node 507:24 fixes the text card at 600×234;
       * previously unset/intrinsic, sized by content. */
      height: 234px;
      display: flex;
      flex-direction: column;
      gap: var(--gap-hero-text);
      padding: var(--space-48);
      border-radius: var(--radius-lg);
      background: var(--bg-page);
    }
    .hero-card__heading {
      color: var(--text-hero-heading);
    }
    .hero-card__subhead {
      color: var(--text-hero-subhead);
    }

    @media (max-width: 599px) {
      .hero-card {
        width: auto;
        height: auto;
      }
      .hero-card__glow {
        inset: calc(-1 * var(--hero-card-offset-top));
        width: auto;
        height: auto;
      }
      .hero-card__content {
        position: static;
        width: auto; /* NEW — the base rule now fixes width/height at
         * 600×234 (node 507:24's desktop text-card size); without an
         * explicit reset here that fixed size leaked into mobile,
         * overflowing the viewport and clipping the box short of its
         * wrapped text. */
        height: auto;
        white-space: normal;
        padding: var(--space-24);
      }
    }

    .section-label {
      color: var(--text-primary);
      padding: var(--padding-section-x);
      border-bottom: 1px dashed var(--border-divider);
    }
  </style>
</head>
<body data-page="work">
  <script src="components/nav.js"></script>

  <section class="hero-section">
    <div class="hero-card">
      <div class="hero-card__glow" aria-hidden="true"></div>
      <div class="hero-card__content">
        <h1 class="hero-card__heading type-hero-heading">Hi, I’m Jake</h1>
        <p class="hero-card__subhead type-hero-subhead">I'm a product designer with a particular interest in design systems: creating the structure that turns scattered decisions into shared, working code.</p>
      </div>
    </div>
  </section>

  <h2 class="section-label type-section-label">Selected Work ↓</h2>

  <script src="components/project-row.js"></script>

  <script src="components/footer.js"></script>
</body>
</html>
