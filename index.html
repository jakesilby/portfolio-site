<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jake Silby — Portfolio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,400&family=Spline+Sans+Mono:wght@400;500&family=Barlow:wght@700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="tokens.css">
  <link rel="stylesheet" href="components/components.css">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      background: var(--bg-page);
      color: var(--text-primary);
      font-family: var(--font-family-sans);
    }
    body {
      max-width: var(--layout-max-width);
      margin: 0 auto;
    }
    .hero {
      display: flex;
      flex-direction: column;
      gap: var(--gap-stack);
      padding: var(--padding-section-y) var(--padding-section-x);
    }
    .hero__eyebrow {
      color: var(--text-accent);
    }
    .hero__tagline {
      color: var(--text-primary);
    }
    .section-label {
      color: var(--text-label);
      padding: 0 var(--padding-section-x) var(--padding-card-y);
      border-bottom: 1px dashed var(--border-divider);
    }
  </style>
</head>
<body data-page="work">
  <script src="components/nav.js"></script>

  <section class="hero">
    <p class="hero__eyebrow type-eyebrow">Hello, I'm Jake Silby</p>
    <p class="hero__tagline type-tagline">A systems-oriented product designer based in Brooklyn, NY.</p>
  </section>

  <p class="section-label type-section-label">Selected Work ↓</p>

  <script src="components/project-row.js"></script>

  <script src="components/footer.js"></script>
</body>
</html>
