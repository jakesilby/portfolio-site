<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jake Silby — Portfolio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;1,400&family=Spline+Sans+Mono:wght@400;500&family=Barlow:wght@700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="tokens.css">
  <link rel="stylesheet" href="components/components.css">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      background: var(--bg-page);
      color: var(--text-primary);
      font-family: var(--font-family-sans);
    }
    .hero-section {
      padding: var(--hero-section-padding-y) var(--padding-section-x);
    }
    .hero-card {
      position: relative;
      width: 634px; /* was 490px — corrected against Figma node 507:24
       * ("Site Hero"), which fixes this at 634px. Previous value was
       * hand-tuned to fit rendered copy rather than matched to the frame. */
      max-width: 100%;
      /* Height is no longer fixed (was 264px, node 507:24) — the card now
       * sits in flow inside this padding, so the wrapper is always
       * card-sized plus the Figma offsets, and the glow below (inset 0)
       * tracks the card at every width instead of a fixed desktop frame.
       * Right/bottom padding reuse --hero-card-offset-top: node 507:24's
       * card sits 15px in from the frame's right and bottom edges too
       * (634 − 19 − 600, 264 − 15 − 234). */
      padding: var(--hero-card-offset-top) var(--hero-card-offset-top) var(--hero-card-offset-top) var(--hero-card-offset-left);
    }
    @property --gradient-angle {
      syntax: '<angle>';
      initial-value: 109.04deg;
      inherits: false;
    }

    .hero-card__glow {
      position: absolute;
      inset: 0 0 0 var(--hero-card-glow-offset-left); /* was top 0 / left
       * glow-offset-left at a fixed 631×263 (node 507:24) — fixed size left
       * the glow behind when the card narrowed. Insetting against the
       * card-sized wrapper gives the same 631px width at desktop; height
       * is 264px, 1px taller than the frame's 263, under the 13.45px blur. */
      border-radius: var(--radius-lg);
      background: linear-gradient(
        var(--gradient-angle),
        var(--bg-accent) 0%,
        var(--color-greenwhite-6) 49%,
        var(--bg-hero) 100%
      ); /* was per-stop color-mix() transparency at 60/30/60% and
       * 0/48.83/99.516% — node 507:24 specifies solid stops at these three
       * colors and percentages, with opacity 0.7 applied once to the whole
       * layer (already set below), not baked into each stop. */
      filter: blur(13.45px) saturate(0.85); /* blur: verified against Figma node 507:24 on
       * 2026-09-14 — 13.45px was correct all along; an earlier pass without
       * live Figma access had changed this to 26.9px, which live
       * verification shows was wrong. saturate(0.85) added 2026-09-28 — desaturated
       * ~15% on request, same on .hero-card__glow and .about-card__glow.
       * A filter, not new color stops, because the middle stop is the shared
       * --color-greenwhite-6 (also --border-divider), which must not move. */
      opacity: 0.7;
    }

    @media (prefers-reduced-motion: no-preference) {
      .hero-card__glow {
        animation: hero-glow-rotate 48s linear infinite;
      }
    }

    @keyframes hero-glow-rotate {
      from { --gradient-angle: 109.04deg; }
      to { --gradient-angle: 469.04deg; }
    }
    .hero-card__content {
      position: relative; /* was absolute at top/left offset-top/-left —
       * now in flow inside .hero-card's padding, which supplies the same
       * offsets. relative keeps it painting above the absolutely
       * positioned glow that precedes it in DOM order. */
      /* width is now auto: 634 − 19 − 15 = 600px at desktop (node 507:24's
       * 600×234 text card), and narrows with .hero-card below that. */
      height: 234px; /* node 507:24's text-card height at full width;
       * released below 730px (see media query) once the card narrows. */
      display: flex;
      flex-direction: column;
      gap: var(--gap-hero-text);
      padding: var(--space-48);
      border-radius: var(--radius-lg);
      background: var(--bg-page);
    }
    .hero-card__heading {
      color: var(--text-hero-heading);
    }
    .hero-card__subhead {
      color: var(--text-hero-subhead);
    }

    @media (max-width: 729px) {
      /* Below 634px card + 2 × 48px section padding, .hero-card narrows
       * and the subhead wraps further — a fixed 234px height would let the
       * text spill past the card. Height follows content from here down. */
      .hero-card__content {
        height: auto;
      }
    }

    @media (max-width: 599px) {
      .hero-card {
        width: auto;
      }
      .hero-card__content {
        white-space: normal;
        padding: var(--space-24);
      }
    }

    .section-label {
      color: var(--text-hero-subhead); /* was text-primary — matches the
       * hero subhead's text/hero-subhead color. Type stays Barlow 16px
       * via .type-section-label. */
      padding: var(--padding-section-x);
      border-bottom: 1px dashed var(--border-divider);
    }
  </style>
  <script>
    window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
  </script>
  <script defer src="/_vercel/insights/script.js"></script>
</head>
<body data-page="work">
  <script src="components/nav.js"></script>

  <section class="hero-section">
    <div class="hero-card">
      <div class="hero-card__glow" aria-hidden="true"></div>
      <div class="hero-card__content">
        <h1 class="hero-card__heading type-hero-heading">Hi, I’m Jake</h1>
        <p class="hero-card__subhead type-hero-subhead">I'm a product designer with a particular interest in design systems: creating the structure that turns scattered decisions into shared, working code.</p>
      </div>
    </div>
  </section>

  <h2 class="section-label type-section-label">Selected Work ↓</h2>

  <script src="components/project-row.js"></script>

  <script src="components/footer.js"></script>
</body>
</html>
