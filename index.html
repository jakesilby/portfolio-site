  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      background: var(--bg-page);
      color: var(--text-primary);
      font-family: var(--font-family-sans);
    }
    .home-hero {
      display: flex;
      flex-direction: column;
      gap: var(--space-32);
      max-width: var(--layout-wide);
      margin-inline: auto;
      padding: var(--space-64) var(--layout-gutter) var(--space-80);
    }
    .home-hero__title {
      font: var(--type-hero);
      letter-spacing: var(--type-hero-letter-spacing);
      color: var(--text-primary);
    }
    .home-hero__credits {
      display: flex;
      flex-direction: column;
      gap: var(--gap-inline);
      max-width: var(--layout-measure);
    }
    .home-hero__line {
      font: var(--type-body);
      letter-spacing: var(--type-body-letter-spacing);
      color: var(--text-primary);
    }
    .home-hero__label {
      font: var(--type-meta);
      letter-spacing: var(--type-meta-letter-spacing);
      color: var(--text-muted);
    }
  </style>
